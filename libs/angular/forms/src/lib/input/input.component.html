<label class="ui-input">
  @if (label) {
    <span class="ui-input__label">{{ label }}</span>
  }
  <input
    class="ui-input__control"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [required]="required"
    [attr.aria-invalid]="!!error"
    (input)="onInput($event)"
  />
  @if (error) {
    <span class="ui-input__error">{{ error }}</span>
  } @else if (hint) {
    <span class="ui-input__hint">{{ hint }}</span>
  }
</label>
