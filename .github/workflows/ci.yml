name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    tags:
      - 'v*' # deploy by tag v0.1.0 и т.п.

env:
  REGISTRY: ghcr.io
  # Keep the existing GHCR package and OMV compose service name until server compose is renamed.
  IMAGE_ROOT_CONFIG: my-desk-shell-frontend
  IMAGE_BOARD: my-desk-board-frontend

jobs:
  # ---------- CI for PR: lint + test ----------
  ci:
    name: Lint & Test (PR + develop)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint workspace
        run: npm run lint

      - name: Test board
        run: npx nx test board

  # ---------- CI/CD for tags ----------
  build-and-deploy:
    name: Build, Test, Docker, Deploy (tag)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint + Test
      - name: Lint workspace
        run: npm run lint

      - name: Test board
        run: npx nx test board --configuration=ci

      # Optional: build before Docker (boost debug)
      - name: Build applications
        run: |
          npx nx build board --configuration=production
          npx nx build root-config
          npx nx build profile
          npx nx build notes

      # ----- Docker login to GHCR -----
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push root-config image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/root-config.dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_ROOT_CONFIG }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_ROOT_CONFIG }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}

      - name: Build and push board image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/board.dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_BOARD }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_BOARD }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OMV_HOST }}
          port: 333
          username: ${{ secrets.OMV_USER }}
          key: ${{ secrets.OMV_SSH_KEY }}
          script: |
            cd ${{ secrets.OMV_DOCKER_COMPOSE_PATH }}
            docker compose --env-file my-desk-frontend.env -f my-desk-frontend.yml pull ${{ env.IMAGE_ROOT_CONFIG }} ${{ env.IMAGE_BOARD }}
            docker compose --env-file my-desk-frontend.env -f my-desk-frontend.yml up -d ${{ env.IMAGE_ROOT_CONFIG }} ${{ env.IMAGE_BOARD }}
            docker exec nginx-proxy nginx -s reload
